[package]
name = "astra-audio"
version = "1.0.0"
edition = "2021"
description = "Ajudante do AstraScreenShare no Windows: som da transmissão (por programa), Não perturbe, teclas e uso da placa de vídeo."
license = "MIT"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "UI_Shell",
  "Win32_System_Registry",
  "Foundation",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
