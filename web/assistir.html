<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Astra · Assistir</title>
  <link rel="icon" href="../icone-192.png">
  <style>
    body.espelho .palco video { visibility: hidden; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #dbdee1;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    [hidden] { display: none !important; }

    .entrada { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #111214; }
    .entrada form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
    .entrada h1 { margin: 0; font-size: 18px; font-weight: 600; color: #f2f3f5; }
    .entrada input { width: 100%; padding: 11px 12px; border: 1px solid #2b2d31; border-radius: 8px;
      background: #1e1f22; color: #f2f3f5; font: inherit; outline: none; }
    .entrada input:focus { border-color: #5865f2; }
    .entrada button { padding: 11px; border: 0; border-radius: 8px; background: #5865f2; color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; }
    .entrada button:hover { background: #4752c4; }
    .entrada small { color: #949ba4; }

    .palco { position: fixed; inset: 0; display: grid; gap: 2px; background: #000; }
    .palco.dois { grid-template-columns: 1fr 1fr; }
    .palco video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    .recado { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      text-align: center; color: #949ba4; pointer-events: none; }
    .canto { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity .3s; }
    body.mexeu .canto, .canto:hover { opacity: 1; }
    .canto button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 8px;
      background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
    .canto button:hover { background: rgba(0,0,0,.85); }
    body.mexeu { cursor: default; }
    body.assistindo:not(.mexeu) { cursor: none; }
  </style>
</head>
<body>
  <div id="entrada" class="entrada">
    <form id="form">
      <h1>Digite um nome para assistir</h1>
      <input id="nome" maxlength="24" placeholder="Seu nome" autocomplete="off" required>
      <button type="submit">Assistir</button>
      <small>Astra</small>
    </form>
  </div>

  <div id="palco" class="palco" hidden></div>
  <div id="recado" class="recado" hidden></div>
  <div class="canto" id="canto" hidden>
    <button id="bt-som" type="button" title="Som" aria-label="Som">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
    </button>
    <button id="bt-cheia" type="button" title="Tela cheia" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 5h5V3H3v7h2V5Zm9-2v2h5v5h2V3h-7Zm5 16h-5v2h7v-7h-2v5ZM5 14H3v7h7v-2H5v-5Z"/></svg>
    </button>
  </div>
  <script src="../assistir.js"></script>
</body>
</html>
