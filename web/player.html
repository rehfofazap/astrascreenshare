<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Player do YouTube da "Música da sala". Fica sempre no endereço da VPS (https), dentro
     de um quadro da página do programa, do app ou do site. Ele só obedece a comandos
     simples (tocar um vídeo, pausar, pular para um segundo, volume) e conta o que acontece. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; frame-src https://www.youtube.com https://w.soundcloud.com; style-src 'unsafe-inline'; img-src https: data:">
<title>Música da sala</title>
<style>#sc { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#aviso { position: fixed; left: 8px; right: 8px; bottom: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.75);
  color: #ddd; font: 13px system-ui, sans-serif; text-align: center; pointer-events: none; z-index: 2; }</style>
</head>
<body>
<div id="player"></div>
<script src="player.js"></script>
</body>
</html>
