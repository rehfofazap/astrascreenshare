<!doctype html>
<!-- Desenhos dos amigos por cima da tela que você está transmitindo (main.js "risco").
     Cada risco some sozinho 3 segundos depois do último ponto. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  "use strict";
  const FICA = 2000, SOME = 1000;   // fica 2 s inteiro e some em 1 s
  // 3.0.20: leve para a GPU (antes ia de ~20% para 70% ao desenhar): redesenha só quando chega risco novo ou enquanto
  // algum some, no máximo 30 vezes por segundo, sem sombra com desfoque e sem multiplicar pela escala da tela.
  const INTERVALO = 33;
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  const riscos = new Map();
  let rodando = false, sujo = false, ultimo = 0;

  // r = {id, cor, pts: [[x, y], ...]} com x e y de 0 a 1 (fração do monitor)
  window.desenhar = (r) => {
    let k = riscos.get(r.id);
    if (!k) { k = { cor: r.cor, pts: [] }; riscos.set(r.id, k); }
    for (const p of r.pts) k.pts.push(p);
    k.t = performance.now();
    sujo = true;
    if (!rodando) { rodando = true; requestAnimationFrame(quadro); }
  };

  // a janela não é mais destruída: fim da live / tecla de emergência só apagam tudo
  window.limpar = () => { riscos.clear(); sujo = false; ctx.clearRect(0, 0, c.width, c.height); };

  function tracar(k, w, h) {
    ctx.beginPath();
    k.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * w, y * h) : ctx.moveTo(x * w, y * h)));
    if (k.pts.length === 1) ctx.lineTo(k.pts[0][0] * w + 0.1, k.pts[0][1] * h);
    ctx.stroke();
  }

  function pintar(agora) {
    const w = innerWidth, h = innerHeight;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    // Riscos primeiro (contorno escuro + cor), borracha por cima: a borracha sempre ganha da caneta.
    for (const [, k] of riscos) {
      if (k.cor === "borracha") continue;
      const idade = agora - k.t;
      ctx.globalAlpha = idade < FICA ? 1 : Math.max(0, 1 - (idade - FICA) / SOME);
      ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 8; tracar(k, w, h);
      ctx.strokeStyle = k.cor; ctx.lineWidth = 5; tracar(k, w, h);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "destination-out";
    ctx.strokeStyle = "#000"; ctx.lineWidth = 40;
    for (const [, k] of riscos) if (k.cor === "borracha") tracar(k, w, h);
    ctx.globalCompositeOperation = "source-over";
  }

  function quadro(agora) {
    if (agora - ultimo >= INTERVALO) {
      let sumindo = false;
      for (const [id, k] of riscos) {
        const idade = agora - k.t;
        if (idade > FICA + SOME) { riscos.delete(id); sujo = true; }
        else if (idade > FICA) sumindo = true;
      }
      if (sujo || sumindo) { pintar(agora); sujo = false; ultimo = agora; }
    }
    if (riscos.size) requestAnimationFrame(quadro);
    else { ctx.clearRect(0, 0, c.width, c.height); rodando = false; }
  }
</script>
</body>
</html>
